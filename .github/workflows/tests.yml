name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch keeps this fast)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pyyaml numpy pillow matplotlib scikit-learn pytest
      - name: Core + every task end to end (demo data -> train -> evaluate -> predict)
        run: python -m pytest tests
