# Multi-label — quick run on synthetic shapes (CPU, about a minute).
base: default.yaml
project_name: shapes-tagger

data:
  image_size: 96
  batch_size: 16
  num_workers: 0
  augment: {hflip: true, vflip: true, rotation: 0, color_jitter: 0.0}

model:
  pretrained: false

train:
  epochs: 15
  lr: 2.0e-3
  early_stopping_patience: 0

output:
  dir: outputs/multilabel_quick

demo:
  n: 450
  size: 96
