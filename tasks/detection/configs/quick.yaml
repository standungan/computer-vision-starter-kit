# Object detection — quick run on synthetic shapes (CPU, a few minutes).
base: default.yaml
project_name: shapes-detector

data:
  image_size: 128
  batch_size: 8
  num_workers: 0

model:
  pretrained: false
  roi_samples_per_image: 32   # our demo images hold at most 3 objects

train:
  epochs: 15
  lr: 1.0e-3
  early_stopping_patience: 0

output:
  dir: outputs/detection_quick

demo:
  n: 240
  size: 128
