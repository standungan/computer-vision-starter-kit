# Computer Vision Starter Kit — single source of truth.
# Change values here; no code edits needed for a new dataset or architecture.

project_name: steel-defect-classifier   # used in titles / the app header
seed: 42

data:
  # Any ImageFolder-style directory: root/<class_name>/*.jpg
  # Example project: NEU surface-defect dataset (see README.md -> Dataset)
  root: data/NEU-CLS
  image_size: 224
  batch_size: 32
  num_workers: 2
  split:            # stratified per class, fixed by `seed`
    train: 0.70
    val: 0.15
    test: 0.15
  augment:          # train-split only; eval/test stay deterministic
    hflip: true
    vflip: true          # steel-surface textures have no canonical "up"
    rotation: 15
    color_jitter: 0.10
    random_erasing: 0.0  # probability; 0 disables

model:
  arch: resnet18    # resnet18 | resnet34 | resnet50 | mobilenet_v3_small | efficientnet_b0
  pretrained: true
  freeze_backbone: false   # true = feature extraction (train the head only)
  dropout: 0.2

train:
  epochs: 20
  lr: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.05
  amp: true                     # mixed precision on CUDA; ignored on CPU
  early_stopping_patience: 5    # 0 disables

output:
  dir: outputs
